<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html{color-scheme:dark}</style>
<title>NoxBlox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: top bar + left rail on desktop, bottom tabs on phones; the game takes over the whole screen. Dark single look by choice. */
:root{
  --bg:#0a0c11; --panel:#12151c; --panel2:#1b2030; --line:#272d3c; --fg:#eef1f7; --muted:#97a0b2;
  --blue:#2f7bff; --badge:#0a84ff; --play:#22c26e; --danger:#ff5a5f; --gold:#ffc83d;
  --display:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.playing{overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:60}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(26px,4vw,34px);font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:inherit}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vbadge{flex:none;vertical-align:middle}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.logo{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:22px;text-decoration:none;white-space:nowrap}
.logo b{color:var(--blue)}
.logo.big{font-size:40px;text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{border-color:#3a4256}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.play{background:var(--play);border-color:var(--play);color:#04170d;font-size:17px;min-height:50px;padding:0 34px;font-family:var(--display);font-weight:700}
.btn.danger{color:var(--danger);border-color:#4a2a30}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;height:56px;max-width:1180px;margin:0 auto}
.search{flex:1;min-width:0;max-width:420px;margin-left:auto}
.search input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.chip{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;min-width:0}
.chip .cav{width:34px;height:34px;border-radius:50%;background:var(--panel2);overflow:hidden;flex:none}
.chip .cn{display:flex;align-items:center;gap:4px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.chip .cn{display:none}.logo{font-size:19px}}

.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-block:24px;max-width:1180px;margin:0 auto}
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:4px}
.nl{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nl:hover{background:var(--panel)}
.nl[aria-current=page]{background:var(--panel2);color:var(--fg)}
.nl svg,.tab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px 0;font-weight:500}
.tab[aria-current=page]{color:var(--blue)}
@media(max-width:860px){.shell{grid-template-columns:minmax(0,1fr);padding-bottom:96px}.side{display:none}.tabbar{display:flex}}

#page{display:flex;flex-direction:column;gap:26px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
section>h2{margin-bottom:12px}
section>h2 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:8px}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:12px;font-size:14px}

/* home */
.hello{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#141a2b,#10131b 70%)}
.hello-av{width:110px;height:110px;border-radius:50%;background:var(--panel2);overflow:hidden;flex:none;border:2px solid var(--line)}
.hello-t{display:flex;flex-direction:column;gap:8px;min-width:0}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.gcard{display:flex;flex-direction:column;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gcard:hover{border-color:var(--blue)}
.thumb{aspect-ratio:16/9;background:#4aa3ff}
.thumb svg,.gthumb svg{display:block;width:100%;height:100%}
.gmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.by{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px}

/* game page */
.ghero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.ghero{grid-template-columns:minmax(0,1fr)}}
.gthumb{aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.ginfo{display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0;padding:0;list-style:none}
kbd{font-family:var(--display);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px}

/* avatar */
.avgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.avgrid{grid-template-columns:minmax(0,1fr)}}
.stage{background:radial-gradient(ellipse at 50% 85%,#26324f,#11141d 70%);border:1px solid var(--line);border-radius:12px;padding:20px 10px 10px;display:flex;justify-content:center}
.avprev{width:min(100%,230px)}
.avsvg{display:block;width:100%;height:auto}
.avctl{display:flex;flex-direction:column;gap:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px}
.swb{aspect-ratio:1;border-radius:8px;border:2px solid rgba(255,255,255,.12);cursor:pointer;padding:0}
.swb.on{outline:3px solid var(--blue);outline-offset:2px}
.custom{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted)}
.custom input{width:44px;height:32px;padding:0;border:none;background:none}

/* profile */
.pcard{padding:0;overflow:hidden}
.banner{height:120px;background:linear-gradient(120deg,#0e2a66,#2f7bff 60%,#6fb7ff);position:relative}
.banner::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 28px),repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 28px)}
.phead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:0 18px;margin-top:-48px;position:relative}
.pav{width:108px;height:108px;border-radius:50%;background:var(--panel2);border:4px solid var(--panel);overflow:hidden;flex:none}
.pname{display:flex;flex-direction:column;gap:4px;flex:1;min-width:160px;padding-bottom:4px}
.role{display:inline-flex;align-items:center;gap:6px;width:fit-content;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8fc2ff;background:#10264d;border:1px solid #1d3f7a;border-radius:6px;padding:2px 10px 2px 6px}
.bio{padding:14px 18px 0;max-width:62ch}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);margin-top:18px;border-top:1px solid var(--line)}
.pstats div{background:var(--panel);padding:14px 18px;display:flex;flex-direction:column}
.rnd5{font-variant-numeric:tabular-nums}
.pstats b{font-family:var(--display);font-size:22px}
.pstats span{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* settings */
.set{display:flex;flex-direction:column;gap:18px;max-width:640px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600}
.field input[type=password],.field input[type=text],.field textarea,.field select,.auth input{width:100%;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;min-height:42px}
.field textarea{resize:vertical;min-height:84px}
.field input[type=range]{width:100%;accent-color:var(--blue)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:none}
.trow input[type=checkbox]{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.trow input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.trow input[type=checkbox]:checked{background:var(--blue)}
.trow input[type=checkbox]:checked::after{transform:translateX(18px)}

/* auth */
.showpw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.showpw input{width:auto;min-height:0}
.authcard .row{justify-content:center}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:32px}
.authcard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.authcard form{display:flex;flex-direction:column;gap:10px}
.err{color:var(--danger);min-height:1.2em;font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#e9eefb;color:#0a0c11;font-weight:600;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:200}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* game */
#game{position:fixed;inset:0;z-index:100;background:#7ec0ff;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.loading{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;transition:opacity .4s;padding:20px;text-align:center}
.loading.out{opacity:0;pointer-events:none}
.bar{width:200px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);animation:ld .9s ease forwards}
@keyframes ld{to{width:100%}}
.hud-tl{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:8px;z-index:3}
.hbtn{height:38px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(10,12,17,.6);color:#fff;font-weight:600;cursor:pointer}
.fps{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:3;color:#fff;font:600 13px var(--display);background:rgba(10,12,17,.55);padding:4px 8px;border-radius:6px}
.nametag{position:absolute;left:0;top:0;pointer-events:none;z-index:2;font:600 14px var(--display);color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;display:flex;align-items:center;gap:4px}
.chat{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:calc(58px + env(safe-area-inset-top,0px));width:min(340px,calc(100% - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));z-index:3;display:flex;flex-direction:column;gap:6px}
.msgs{max-height:150px;overflow:hidden;font-size:13px;color:#fff}
.chat.open .msgs{overflow:auto}
.m{background:rgba(10,12,17,.6);padding:3px 9px;border-radius:6px;margin-bottom:3px;width:fit-content;max-width:100%;overflow-wrap:anywhere;display:block}
.m b{margin-right:6px;display:inline-flex;align-items:center;gap:3px}
.chat:not(.open) .m.old{display:none}
.chat input{display:none;width:100%;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,17,.8);color:#fff;padding:0 12px}
.chat.open input{display:block}
.joy,.jump{display:none;position:absolute;z-index:3;touch-action:none;border-radius:50%}
.joy{left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:128px;height:128px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35)}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.65)}
.jump{right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(44px + env(safe-area-inset-bottom,0px));width:84px;height:84px;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.45);color:#fff;font-weight:700;font-size:13px}
.touch .joy,.touch .jump{display:block}
.pause{position:absolute;inset:0;background:transparent;display:flex;align-items:stretch;justify-content:flex-start;z-index:6}
.pbox{width:min(32.6vw,626px);min-width:min(86vw,300px);background:rgba(0,0,0,.72);border-radius:0 clamp(28px,6.5vw,125px) clamp(28px,6.5vw,125px) 0;padding:clamp(16px,2vw,24px);padding-bottom:clamp(16px,2.2vw,28px);display:flex;flex-direction:column;gap:clamp(12px,2.2vh,20px);color:#fff;overflow:auto}
.pbox h2{margin:0 0 4px}
.pbox .gap{flex:1 1 auto;min-height:8px}
.pbtn{width:100%;height:clamp(54px,12vh,130px);border-radius:999px;font:700 clamp(17px,2.6vh,26px) var(--display,inherit);color:#fff;cursor:pointer;background:#000;border:3px solid #fff;flex:0 0 auto}
.pbtn:hover,.pbtn:focus-visible{filter:brightness(1.25);outline:none}
.pbtn.blue{background:#0a76cc;border-color:#0a76cc}
.pbox p{font-size:13px;color:#c9c9c9}
/* aksesori kepala */
.mlist{display:flex;flex-direction:column;gap:14px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.hcard{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.hprev{aspect-ratio:1/0.9;background:radial-gradient(circle at 50% 60%,#2a2f42,#161a24);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:6px}
.hprev .avsvg{width:100%;height:100%}
.hinfo{display:flex;flex-direction:column;gap:4px;flex:1}
.hinfo h3{font-size:15px}
.fx{font-size:12px;font-weight:600;color:#8fc2ff;background:#10264d;border:1px solid #1d3f7a;border-radius:6px;padding:2px 8px;width:fit-content}
.hcard .btn{width:100%}
/* item per bagian */
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.dimc{opacity:.45;pointer-events:none}
.invset{display:flex;flex-direction:column;gap:12px}
.pieces{display:flex;flex-direction:column;gap:10px}
.piece{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.piece.worn{border-color:var(--blue)}
.piece h3{font-size:15px}
.pprev{width:72px;height:72px;background:radial-gradient(circle at 50% 60%,#2a2f42,#161a24);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px}
.pprev .avsvg{width:100%;height:100%}
/* marketplace */
.item{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
@media(max-width:700px){.item{grid-template-columns:minmax(0,1fr)}}
.iprev{background:radial-gradient(ellipse at 50% 85%,#3a2312,#11141d 72%);border-radius:10px;padding:18px 24px 10px;display:flex;justify-content:center}
.iprev .avsvg{width:min(100%,190px)}
.iinfo{display:flex;flex-direction:column;gap:10px;min-width:0;align-items:flex-start}
.iinfo .row,.iinfo .parts{align-self:stretch}
.parts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.parts li{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;font-size:13px}
.parts li span{color:var(--muted)}
.note{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:#5a3a12}
.avctl.dim>.card{opacity:.45;pointer-events:none}
/* noxbux + misi */
.nox{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;white-space:nowrap;color:var(--gold)}
.nox svg{flex:none}
.bal{display:flex;align-items:center;height:34px;padding:0 12px;border-radius:17px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;flex:none}
.bal:hover{border-color:var(--gold)}
.mhead{display:flex;flex-direction:column;gap:12px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
.meter.gold i{background:var(--gold)}
.missions{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.mis{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.mis.done{border-color:#1f5f3b}
.mis.got{opacity:.6}
.mis h3{font-size:15px}
.mis .meter{grid-column:1/-1}
.mis .prog{font-size:12px;color:var(--muted);white-space:nowrap}
.btn.claim{background:var(--gold);border-color:var(--gold);color:#241a00;min-height:38px;padding:0 14px}
.btn.claim .nox{color:#241a00}
.btn.claim[disabled]{background:var(--panel2);border-color:var(--line);color:var(--muted);cursor:default}
.mteaser{display:flex;flex-direction:column;gap:12px;text-decoration:none}
.mteaser:hover{border-color:var(--gold)}
.hbal{display:inline-flex;align-items:center;gap:.35em;height:var(--hs);padding:0 calc(var(--hs)*.4);border-radius:999px;color:#fff;font:700 calc(var(--hs)*.4) var(--display,inherit);white-space:nowrap;background:rgba(18,18,21,.6);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hbal span:first-child{color:#ffc83d}
.hud-tl{--hs:clamp(38px,5.2vh,50px);align-items:center;gap:calc(var(--hs)*.2)}
.hcirc,.hchat{flex:0 0 auto;width:var(--hs);height:var(--hs);border-radius:50%;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;background:rgba(18,18,21,.6);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.3)}

function banDo(kind,raw){
  var me=cur();if(!me||!isOwner(me))return 'Perintah ban hanya untuk Owner.';
  var n=String(raw||'').trim();if(!/^[A-Za-z0-9_]{3,20}$/.test(n))return 'Tulis nama pengguna yang valid, contoh: /'+kind+' Test';
  var k=n.toLowerCase();if(k===me.name.toLowerCase()||k==='noxblox')return 'Owner tidak bisa memban diri sendiri.';
  var b=banSet();
  if(kind==='unban'){var was=!!(b.play[k]||b.acc[k]);delete b.play[k];delete b.acc[k];save();var cd=inCode(BAN_PLAY,k)||inCode(BAN_ACCOUNT,k);return was?(n+' dibuka bannya'+(cd?' (tapi namanya masih ada di daftar BAN di kode)':'')):(cd?(n+' diban lewat kode. Hapus namanya dari BAN_PLAY atau BAN_ACCOUNT di kode.'):(n+' tidak sedang diban.'))}
  if(kind==='banplay'){b.play[k]=1;save();return 'Ban Play: '+n+' tidak bisa bermain game, hanya bisa di lobi.'}
  if(kind==='banacc'){b.acc[k]=1;save();return 'Ban Account: akun '+n+' tidak bisa masuk.'}

}

    if(R.monCD>0)R.monCD-=dt;
    R.ride=(R.ride||0)+((R.mount?MON_RIDE:0)-(R.ride||0))*Math.min(1,dt*6);
    var m=R.mon;if(!m||m.hp<=0)return;
    var moving=false,dx,dz,d;
    if(R.mount){m.x=pp.x;m.z=pp.z;m.y=pp.y;m.ry=face;moving=Math.hypot(vx,vz)>1.5}
    else{
      dx=pp.x-m.x;dz=pp.z-m.z;d=Math.hypot(dx,dz)||1;
      if(d>9){var sp=Math.min(32,(d-6)*3+14);m.x+=dx/d*sp*dt;m.z+=dz/d*sp*dt;m.ry=Math.atan2(dx,dz);moving=true}
      m.y+=(Math.min(pp.y,0.05)-m.y)*Math.min(1,dt*8);
    }
    m.biteT-=dt;if(m.bite>0)m.bite-=dt;
    if(m.biteT<=0){
      var hit=0;
      railTargets().forEach(function(z){if(z.dead||(z.home&&!z.act))return;if(Math.hypot(z.x-m.x,z.z-m.z)<10&&Math.abs(z.y-m.y)<8){railHitZ(z,70);hit++}});
      m.biteT=hit?0.7:0.2;if(hit)m.bite=0.3;
    }
    m.ph+=dt*(moving?11:0);
    var sw=moving?Math.sin(m.ph)*0.6:0;
    m.legs[0].rotation.x=sw;m.legs[3].rotation.x=sw;m.legs[1].rotation.x=-sw;m.legs[2].rotation.x=-sw;
    if(m.bite>0)m.legs[3].rotation.x=-1.5;
    m.head.rotation.x=m.bite>0?0.2:0;
    m.g.position.set(m.x,m.y,m.z);m.g.rotation.y=m.ry;
  }

  function railShoot(){
    var fx=-Math.sin(yaw),fz=-Math.cos(yaw),best=null,bd=80;
    face=Math.atan2(fx,fz);
    railTargets().forEach(function(z){
      if(z.dead||(z.home&&!z.act))return;
      var dx=z.x-p.x,dz=z.z-p.z,al=dx*fx+dz*fz,pe=Math.abs(dx*fz-dz*fx);
      if(al>0&&al<bd&&pe<1.8&&Math.abs(z.y+2.5-(p.y+3))<6){best=z;bd=al}
    });
    var len=best?bd:60;
    R.tracer.position.set(p.x+fx*(len/2+1.4),p.y+3.5,p.z+fz*(len/2+1.4));
    R.tracer.rotation.y=Math.atan2(fx,fz);R.tracer.scale.set(1,1,len);R.tracer.visible=true;R.trT=0.07;
    if(best)railHitZ(best,34);

  function railCtx(){
    if(!R||R.end)return null;
    if(R.mount)return {label:'Turun dari monster',act:monDismount};
    if(R.driving)return {label:'Turun dari kemudi',act:railToggleDrive};
    var best=null,bd=1e9;
    function cand(d,max,label,act){if(d<max&&d<bd){bd=d;best={label:label,act:act}}}
    if(R.mon&&R.mon.hp>0&&p.y<RDECK+11)cand(Math.hypot(p.x-R.mon.x,p.z-R.mon.z),6.5,'Naiki monster',monRide);
    if(p.y>RDECK-1&&p.y<17&&Math.abs(p.x)<7){
      cand(Math.hypot(p.x-1.7,p.z-(R.zT+11.9)),4.4,R.coal>0?'Isi tungku ('+R.coal+' batu bara)':'Tungku (butuh batu bara)',railFuel);
      cand(Math.hypot(p.x+1.9,p.z-(R.zT+17.9)),3.4,'Kemudikan kereta',railToggleDrive);
    }
    R.feats.forEach(function(f){
      if(!f.built)return;
      if(f.shop)cand(Math.hypot(p.x-f.shop.x,p.z-f.shop.z),9,'Buka toko',railShop);
      f.chests.forEach(function(cs){if(cs.o&&!cs.opened)cand(Math.hypot(p.x-cs.x,p.z-cs.z),4.6,'Buka peti',function(){railOpenChest(cs)})});
      if(f.lever&&p.y<3)cand(Math.hypot(p.x-f.lever.x,p.z-f.lever.z),5,R.bridge.state===0?'Tarik tuas jembatan':(R.bridge.state===1?'Jembatan sedang turun':'Jembatan sudah turun'),railLever);
    });
    return best;
  }

  function railWorld(){

    R.feats.forEach(function(f){
      var d=Math.abs(R.zT-f.z);

        f.built=true;CUR=f.c;

      }
    });

  function railTick(dt,pp,gr){
    if(!R||R.end)return;
    R.t+=dt;R.hitT+=dt;todTick(dt,pp);if(R.unl)R.fuel=TANKMAX;
    if(R.driving)R.th=Math.max(0,Math.min(1,R.th+R.thIn*dt*0.35));else R.th=Math.max(0,R.th-dt*0.06);
    var tgt=R.fuel>0?R.th*RV*(R.sm||1):0;
    R.speed+=(tgt-R.speed)*Math.min(1,dt*(tgt>R.speed?0.35:0.9));
    if(tgt===0&&R.speed<0.05)R.speed=0;
    var dz=R.speed*dt,maxZ=R.bridge.state===2?1e9:ZB0-14-31;
    if(R.zT+dz>maxZ){dz=Math.max(0,maxZ-R.zT);R.speed=0;if(!R.bwarn){R.bwarn=1;G.toast('Jembatan terputus! Tarik tuas di markas bandit')}}else if(R.zT+dz<maxZ-60)R.bwarn=0;
    dz=baseBlock(dz);

    if(R.fuel<=0&&R.speed>0.5&&!R.warn){R.warn=1;G.toast('Bahan bakar habis!')}else if(R.fuel>0)R.warn=0;
    for(var di=0;di<R.decks.length;di++){var dk=R.decks[di];dk.cz=R.zT+dk.oz;sync(dk)}
    if(gr&&gr.rail)pp.z+=dz;
    R.trainG.position.z=R.zT;
    for(var wi=0;wi<R.wheels.length;wi++)R.wheels[wi].rotation.x+=dz/1.3;
    if(R.driving){pp.x=-1.9;pp.z=R.zT+17.9;pp.y=RDECK+0.05;vx=0;vz=0;vy=0}
    if(R.cls==='witch'){if(R.hitT>1&&R.hp<100)R.hp=Math.min(100,R.hp+9*dt)}else if(R.hitT>4&&R.hp<100)R.hp=Math.min(100,R.hp+2*dt);
    railWorld();
    var i,k;
    /* pickup tersebar */
    for(k in R.segs){var pl=R.pickups[k]||[];
      for(i=0;i<pl.length;i++){var pk=pl[i];if(pk.got||!pk.m)continue;pk.m.rotation.y+=dt*2;pk.m.position.y=pk.y+Math.sin(R.t*2+i)*0.3;
        if((Math.abs(pp.x-pk.x)<3.4&&Math.abs(pp.z-pk.z)<3.4&&Math.abs(pp.y-pk.y)<6)||(R.cls==='witch'&&R.clv>=3&&R.mon&&R.mon.hp>0&&Math.hypot(R.mon.x-pk.x,R.mon.z-pk.z)<8)){pk.got=1;scene.remove(pk.m);
          if(pk.kind==='gold'){R.gold++;G.toast('+1 emas ('+R.gold+')')}else{R.coal++;G.toast('+1 batu bara ('+R.coal+')')}}}}
    /* jembatan */
    var B=R.bridge;
    if(B.state===1){B.t+=dt;B.prog=Math.min(1,B.t/300);if(B.hinge)B.hinge.rotation.x=-(1-B.prog)*Math.PI/2;
      if(B.prog>=1){B.state=2;if(B.solid)B.solid.on=true;G.toast('Jembatan sudah turun! Seberangi dengan kereta')}}
    /* zombie */
    var alive=0,z,dx,dz2,d;
    for(i=R.zombies.length-1;i>=0;i--){
      z=R.zombies[i];
      if(z.dead){z.dead+=dt;z.g.rotation.x=-Math.min(1,z.dead*3)*Math.PI/2;if(z.dead>1.4){scene.remove(z.g);R.zombies.splice(i,1)}continue}
      dx=pp.x-z.x;dz2=pp.z-z.z;d=Math.hypot(dx,dz2)||1;
      if(z.home&&!z.act){if(d<26&&Math.abs(pp.y-z.y)<8)z.act=true;else{z.g.position.set(z.x,z.y,z.z);continue}}
      if(!z.home&&d>170){scene.remove(z.g);R.zombies.splice(i,1);continue}
      if(!z.home)alive++;
      if(d>2.2){var ox=z.x,oz=z.z;z.x+=dx/d*z.sp*dt;z.z+=dz2/d*z.sp*dt;if(baseZone(z.x,z.z)){z.x=ox;z.z=oz}z.ph+=dt*z.sp*0.9}

  var dend=function(e){if(jid!==null&&e.pointerId===jid){jend(e);return}delete ptrs[e.pointerId];pinch=0};

  cv.addEventListener('wheel',function(e){e.preventDefault();var nd=tdist+e.deltaY*(e.ctrlKey?0.08:0.02);if(e.deltaY<0&&nd<2)nd=0.5;else if(e.deltaY>0&&tdist<2)nd=Math.max(nd,3);tdist=clampD(nd)},{passive:false,signal:ac.signal});
  var joyEl=$('#gjoy',ov),knob=$('#gknob',ov),jid=null;
  function jmove(e){var r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=r.width/2*0.8,l=Math.hypot(dx,dy);
    if(l>m){dx=dx/l*m;dy=dy/l*m}knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/m;joy.y=-dy/m}
  joyEl.addEventListener('pointerdown',function(e){jid=e.pointerId;joyEl.classList.add('on');joyEl.setPointerCapture(jid);jmove(e)});
  joyEl.addEventListener('pointermove',function(e){if(e.pointerId===jid)jmove(e)});

  function joyFloat(e){var r=ov.getBoundingClientRect(),m=joyEl.offsetWidth/2||64;
    joyEl.style.left=Math.max(4,Math.min(r.width-2*m-4,e.clientX-r.left-m))+'px';joyEl.style.top=Math.max(4,Math.min(r.height-2*m-4,e.clientY-r.top-m))+'px';joyEl.style.bottom='auto';
    jid=e.pointerId;joyEl.classList.add('on');try{cv.setPointerCapture(jid)}catch(er){}jmove(e);return true}

  var jb=$('#gjump',ov);
  jb.addEventListener('pointerdown',function(e){e.stopPropagation();try{jb.setPointerCapture(e.pointerId)}catch(er){}jumpHeld=true;jq=true;jb.classList.add('on')});
  ['pointerup','pointercancel'].forEach(function(n){jb.addEventListener(n,function(){jumpHeld=false;jb.classList.remove('on')})});

  function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
  window.addEventListener('resize',resize,sig);resize();

  /* ---- fisika per langkah kecil ---- */
  function collideAxis(ax){
    for(var i=0;i<solids.length;i++){var b=solids[i];
      if(!b.on||p.y+0.04>=b.y1||p.y+PH<=b.y0)continue;
      if(p.x+HW<=b.x0||p.x-HW>=b.x1||p.z+HW<=b.z0||p.z-HW>=b.z1)continue;
      if(ax===0){p.x=p.x<b.cx?b.x0-HW:b.x1+HW;vx=0}
      else{p.z=p.z<b.cz?b.z0-HW:b.z1+HW;vz=0}
    }
  }
  function sub(h){
    p.x+=vx*h;collideAxis(0);
    p.z+=vz*h;collideAxis(1);
    if(!flying){vy-=GRAV*(coilHeld()&&vy<0?0.4:1)*h;if(coilHeld()&&vy<-24)vy=-24}var py=p.y;p.y+=vy*h;
    onG=false;ground=null;
    for(var i=0;i<solids.length;i++){var b=solids[i];
      if(!b.on)continue;
      if(p.x+HW<=b.x0||p.x-HW>=b.x1||p.z+HW<=b.z0||p.z-HW>=b.z1)continue;
      if(vy<=0&&py>=b.y1-0.05&&p.y<=b.y1){p.y=b.y1;vy=0;onG=true;ground=b}
      else if(vy>0&&py+PH<=b.y0+0.05&&p.y+PH>b.y0){p.y=b.y0-PH;vy=0}
    }
  }

  var acc={walk:0,time:0},accT=0;
  var showFps=!!st.fps,fpsEl=$('#gfps',ov);fpsEl.hidden=!showFps;
  var last=performance.now(),fa=0,fn=0;
  function step(dt){
    if(dt<=0)return;
    if(vehTick(dt))return;
    if(spGrace>0){spGrace-=dt;if(p.y<spY-0.6&&!flying){p.y=spY;vy=0;onG=true}}
    var ix=(keys.d?1:0)-(keys.a?1:0)+joy.x,iz=(keys.w?1:0)-(keys.s?1:0)+joy.y;
    if(rails&&R){R.thIn=R.driving?Math.max(-1,Math.min(1,iz)):0;if(R.driving){ix=0;iz=0}}
    var len=Math.hypot(ix,iz);if(len>1){ix/=len;iz/=len}
    var spd=16*(perk('speed')?1.35:1)*(rails&&R?(R.cls==='super'?R.sps:1)*(R.mount?R.msp:1):1),s=Math.sin(yaw),c=Math.cos(yaw);
    var tx2=(ix*c-iz*s)*spd,tz2=(-ix*s-iz*c)*spd,a=Math.min(1,dt*12);
    vx+=(tx2-vx)*a;vz+=(tz2-vz)*a;
    if(flying){var cpf=Math.cos(pitch),fs=(rails&&R&&R.cls==='super'&&R.clv>=3?60:50),fxv=-s*cpf,fyv=-Math.sin(pitch),fzv=-c*cpf;
      var tvx=(ix*c+iz*fxv)*fs,tvz=(-ix*s+iz*fzv)*fs,tvy=iz*fyv*fs+((keys.j||jumpHeld)?fs*0.6:0);
      vx+=(tvx-vx)*a;vz+=(tvz-vz)*a;vy+=(tvy-vy)*a}
    gtime+=dt;
    world.update(dt,gtime,p,ground);
    var sp=Math.hypot(vx,vz);
    if(onG&&sp>1)acc.walk+=sp*dt;acc.time+=dt;accT+=dt;
    if(accT>=1){track('walk',acc.walk);track('time',acc.time);acc.walk=acc.time=0;accT=0}

    if(gsm.length)ghostSmoke(gtime);
    var tm=trailNow();
    puffT+=dt;
    if(tm&&puffT>(tm==='fire'?(sp>1.5?0.03:0.11):0.045)&&(tm==='fire'||(sp>1.5&&onG))){
      puffT=0;var pf=null;
      for(var q=0;q<puffs.length;q++){if(puffs[q].userData.age>=puffs[q].userData.life){pf=puffs[q];break}}
      if(pf){
        var fz=tm==='fire',fm=fz&&sp>1.5;pf.userData.fire=fz;
        pf.position.set(p.x-Math.sin(face)*(fz?(fm?0.8:0):0.9)+(Math.random()-0.5)*(fz?0.5:0.7),p.y+(fz?(fm?5.2:7.0)+Math.random()*0.5:0.6),p.z-Math.cos(face)*(fz?(fm?0.8:0):0.9)+(Math.random()-0.5)*(fz?0.5:0.7));
        if(tm==='fire')pf.material.color.setHSL(0.02+Math.random()*0.1,1,0.5+Math.random()*0.15);else if(tm==='ghost')pf.material.color.setRGB(1,1,1);else if(tm==='crown')pf.material.color.setRGB(0.25,0.62,1);else pf.material.color.setHSL((gtime*0.6)%1,0.95,0.6);
        pf.userData.age=0;pf.userData.life=1.1+Math.random()*0.5;pf.visible=true;
      }
    }
    for(var q2=0;q2<puffs.length;q2++){
      var pu=puffs[q2],ud=pu.userData;
      if(ud.age<ud.life){ud.age+=dt;var tq=Math.min(1,ud.age/ud.life);pu.position.y+=dt*1.3;pu.scale.setScalar(ud.fire?1.7-tq*1.2:1.1+tq*2.6);pu.material.opacity=0.8*(1-tq);if(ud.age>=ud.life)pu.visible=false}
    }
    if(coins.length){
      coinT+=dt;var cmv=sp>1.5;
      if(coinT>(cmv?0.07:0.12)){
        coinT=0;var cn=null;for(var cq=0;cq<coins.length;cq++){if(coins[cq].userData.age>=coins[cq].userData.life){cn=coins[cq];break}}
        if(cn){var cj=cmv?0.5:0.8;cn.position.set(p.x+(cmv?-Math.sin(face)*0.6:0)+(Math.random()-0.5)*cj,p.y+5.9+Math.random()*0.3,p.z+(cmv?-Math.cos(face)*0.6:0)+(Math.random()-0.5)*cj);cn.material.rotation=(Math.random()-0.5)*1.2;cn.userData.age=0;cn.userData.life=(cmv?1.3:1.8)+Math.random()*0.6;cn.userData.vy=cmv?0.5:1.6;cn.visible=true}
      }
      for(var cq2=0;cq2<coins.length;cq2++){var cu=coins[cq2],cd=cu.userData;if(cd.age<cd.life){cd.age+=dt;var cp=cd.age/cd.life;cu.position.y+=dt*cd.vy;cu.scale.setScalar(0.62-cp*0.2);cu.material.opacity=1-cp*cp;if(cd.age>=cd.life)cu.visible=false}}
    }
    if(sp>1){var ta=Math.atan2(vx,vz),df=ta-face;df=Math.atan2(Math.sin(df),Math.cos(df));face+=df*Math.min(1,dt*14)}
    if(dist<1.2){var tf=yaw+Math.PI,d2=Math.atan2(Math.sin(tf-face),Math.cos(tf-face));face+=d2*Math.min(1,dt*14)}

    coyote=onG?0.12:Math.max(0,coyote-dt);
    var JV=coilHeld()?66:50;
    var jnow=!!(keys.j||jumpHeld);
    if(rails&&R&&!R.end&&jnow&&!step._jp&&(R.mount||R.driving)){if(R.mount)monDismount();else railToggleDrive()}
    step._jp=jnow;
    if((keys.j||jumpHeld)&&coyote>0&&!flying&&!(rails&&R&&R.driving)){vy=JV;onG=false;coyote=0;usedDbl=false;track('jump',1)}
    else if(jq&&perk('dj')&&!onG&&!usedDbl){vy=JV*0.95;usedDbl=true;track('jump',1)}
    jq=false;
    if(onG)usedDbl=false;

    var n=Math.max(1,Math.ceil(dt/0.0125)),h=dt/n;
    for(var i=0;i<n;i++)sub(h);

    if(world.deadly(p)){die();return}
    if(p.y<world.killY){dead+=dt;if(dead>=world.killDelay){die();return}}else dead=0;
    if(obby&&ground&&ground.cp!==undefined)reach(ground.cp);

    anim+=dt*sp*0.55;
    var target=sp>1&&onG?Math.sin(anim)*0.85:0;
    swing+=(target-swing)*Math.min(1,dt*18);
    legL.rotation.x=swing;legR.rotation.x=-swing;
    armL.rotation.x=onG?-swing:-2.6;armR.rotation.x=onG?swing:-2.6;toolPose(dt);
  }
  function frame(now){
    raf=requestAnimationFrame(frame);
    var dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;
    fa+=dt;fn++;if(fa>=0.5){if(showFps)fpsEl.textContent=Math.round(fn/fa)+' FPS';fa=0;fn=0}
    if(!paused){step(dt);fnTick(dt)}
    npcTick(dt,now);vehHud(dt);fpToolSync();
    mpTick(dt);
    if(rails){tdist=0.5;dist=0.5}
    dist+=(tdist-dist)*Math.min(1,dt*10);
    player.position.copy(p);if(rails&&R)player.position.y+=(R.driving?-1.2:(R.ride||0));player.rotation.y=face;
    if(V.mode==='sit'){player.position.y-=0.4;legL.rotation.x=-1.5;legR.rotation.x=-1.5;armL.rotation.x=-0.5;armR.rotation.x=-0.5}
    if(V.mode==='drive'){player.visible=false;V.wasDrive=1}else if(V.wasDrive){V.wasDrive=0;player.visible=!fpOn}
    for(var fl=0;fl<flameM.length;fl++){var fm2=flameM[fl];fm2.scale.y=1+0.28*Math.sin(now/90+fl*1.9);fm2.scale.x=fm2.scale.z=1+0.12*Math.sin(now/70+fl*2.3);fm2.position.y=fm2.userData.by+0.05*Math.sin(now/110+fl)}
    for(var ei2=0;ei2<embers.length;ei2++){var e=embers[ei2],t=now/700+e.userData.s;e.position.set(Math.cos(t)*0.45,4.95+Math.sin(t*1.4)*0.4,Math.sin(t)*0.45)}
    if(world.sky)world.sky(p.y);
    sun.position.set(p.x+30,p.y+60,p.z+20);sun.target.position.copy(p);
    pitch=clampPitch(pitch);
    var fp=dist<1.2;
    if(fp!==fpOn){fpOn=fp;player.visible=!fp;for(var fi=0;fi<fpHide.length;fi++)fpHide[fi].visible=!fp;if(fp&&!rails)G.toast('Kamera orang pertama. Zoom keluar untuk kembali.');else unlock()}
    var cp=Math.cos(pitch),fk=Math.max(0,Math.min(1,(2.2-dist)/1.7)),fy=3.2+1.5*fk+((rails&&R&&R.ride)||0);
    if(LB&&LB.cam){LB.cam.a+=dt*0.35;camera.position.set(44+Math.sin(LB.cam.a)*50,20,10+Math.cos(LB.cam.a)*50);camera.lookAt(44,6,10)}else{
    camera.position.set(p.x+Math.sin(yaw)*cp*dist,p.y+fy+Math.sin(pitch)*dist,p.z+Math.cos(yaw)*cp*dist);
    camera.lookAt(p.x,p.y+fy,p.z)}

    }

}
